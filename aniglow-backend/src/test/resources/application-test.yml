spring:
  datasource:
    url: jdbc:h2:mem:aniglow_test;DB_CLOSE_DELAY=-1;MODE=MySQL;NON_KEYWORDS=YEAR,TYPE,STATUS,SOURCE,SEASON,RATING,VALUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 2
      maximum-pool-size: 5
      idle-timeout: 300000
      max-lifetime: 1200000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      # CI 不提供 Redis；测试必须证明应用上下文不依赖外部缓存才能启动。
      port: 63999
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

aniglow:
  search:
    fulltext-enabled: false
  upload:
    dir: ${java.io.tmpdir}/aniglow-test
    max-file-size: 10485760
    allowed-types: image/jpeg,image/png,image/gif,image/webp

  bayesian:
    global-mean: 7.0
    min-ratings: 50
    confidence-weight: 25

  jikan:
    base-url: http://localhost:8089/jikan
    sync-interval: 3600000
    request-delay: 0

  ai:
    openai:
      api-key: test-api-key
      base-url: https://ark.cn-beijing.volces.com/api/coding/v3
      enabled: false
      timeout: 5000
      chat:
        options:
          model: test-model
          temperature: 0.7

  jwt:
    secret: YW5pZ2xvdy1qd3Qtc2VjcmV0LWtleS1mb3Itc3ByaW5nLWJvb3QtYXBwbGljYXRpb24tdGVzdGtleTEyMzQ1Ng==
    expiration: 86400000
    refresh-expiration: 604800000

  task:
    scheduling:
      enabled: false

logging:
  level:
    com.aniglow: INFO
    org.springframework.security: WARN
